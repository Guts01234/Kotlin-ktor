ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.taskboard.ApplicationKt.module ]
    }
}

app {
    name = "taskboard-api"
    environment = ${?APP_ENV}
    environment = development
}

db {
    // Prefer full JDBC URL from env (Docker / local).
    url = "jdbc:postgresql://localhost:5432/taskboard"
    url = ${?DATABASE_URL}

    user = "taskboard"
    user = ${?DATABASE_USER}

    password = "taskboard"
    password = ${?DATABASE_PASSWORD}

    // HikariCP pool sizing — start small for a learning service.
    maxPoolSize = 10
}

jwt {
    // HMAC secret — MUST be overridden via JWT_SECRET in real environments.
    secret = "dev-only-change-me-to-a-long-random-string"
    secret = ${?JWT_SECRET}

    issuer = "taskboard-api"
    audience = "taskboard-api"
    realm = "TaskBoard"

    // Access token lives briefly; refresh is long-lived and stored hashed in DB.
    accessTokenTtlMinutes = 15
    refreshTokenTtlDays = 30
}
